# 第二轮的过程记录：安全检查、自检、试点、正式运行和评审各步的时间，中途改过什么、为什么改。时间是北京时间。
# 网站的「过程记录」页从这里生成。evidence 里 log:<名字> 指 logs/ 下的日志，file:<路径> 指仓库里的文件。

[[event]]
time = "2026-10-20T07:22:00+08:00"
title = "检查运行环境，给参赛仓库做安全检查"
body = "本机是 Claude Code 2.1.304，评审复核用 Codex CLI 0.163.0。11 个参赛仓库先用清单收录时那套安全检查脚本查了一遍（不调模型，查二进制和压缩包、安装钩子、远程执行、读敏感文件）：8 个通过，3 个「要看」。逐个打开看过：oh-story 和 chinese-webnovel-skills 被标出的是 Windows 上的启动脚本（.cmd、.bat），只是找 Python 再运行；oh-story 的浏览器控制 skill 和 webfiction-write 的扫榜脚本会在用户自己打开的网页里读登录态，用来抓榜单。这些都不是恶意代码，而且沙箱里不能联网、没有浏览器，用不上。另用便宜的模型确认了一件事：项目级 skill 的调用名是它的文件夹名，入口按文件夹名写。"
evidence = ["file:evals/runs/002-topic/contestants.toml"]

[[event]]
time = "2026-10-20T07:24:00+08:00"
title = "沙箱自检：围栏拦不拦得住"
body = "用和正式运行同一段围栏代码，让便宜的 claude-haiku-5-5 在一个假的工作目录里逐条试：读运行者的主目录、读别的参赛者的目录、列上一级目录、联网、在工作目录外写文件，全部被拦；用 Read 工具读别的参赛者的文件也被拒，它开的子 agent 同样受限。python3、node 能跑，cd 之后在工作目录里能写，for 循环能跑。第一轮修过的两个权限问题没有复发。"
evidence = ["log:check-1"]

[[event]]
time = "2026-10-20T07:25:00+08:00"
title = "试点：对照组和 webnovel-writer 各跑一次"
body = "第一次启动时，运行器里新加的「读这一轮的开场指令和固定回复」的函数和一个变量重名，还没调用模型就报错退出；改名后重跑。对照组 3 轮写完。webnovel-writer 跑了 6 轮：第 1 轮 3 分半钟写出选题，第 2 轮把一个文件拆成和需求对应的两份，第 4 轮自查时改了一处设定矛盾，之后两轮没再改，停下。开场指令、固定回复和停止规则都按设计工作。试点产出不进评审，正式运行全部重跑。"
evidence = ["log:pilot-1.baseline", "log:pilot-1.lingfengQAQ__webnovel-writer", "file:evals/run.py"]

