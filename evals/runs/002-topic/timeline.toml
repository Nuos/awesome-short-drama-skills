[[event]]
time = "2026-10-23T03:30:00+08:00"
title = "换评分标准，先试判"
body = "两两盲比的提示词换成新的评分标准。原来评审以「有经验的网文和竖屏短剧编辑」的身份评，「可执行」一项看人物和场景规模是否合理、有没有明显的审核风险。新标准假定选题要交给 AI 从头拍成竖屏短剧，没有演员和片场，画面、声音、口型都由视频模型生成：特效、异能、奇幻、大场面、群戏、场景多、角色多都不扣分，场面大也不单独加分，审核风险不再算分。「可执行」改名「上屏」，看观众代入谁、这个人有没有一张能演戏的脸，每次爽点落在谁脸上，关键情绪靠不靠心里话撑。两轮合起来挑了 10 场原来理由里最常拿成本、特效、审核说事的，两位评审各试判一遍，理由里不再拿制作成本比高下，才开始全部重判。"
evidence = ["file:evals/judge.py"]

[[event]]
time = "2026-10-23T03:40:00+08:00"
title = "两位评审重判 396 场盲比"
body = "匿名稿、配对和两种先后顺序都不变，只换提示词。Opus 14 分钟判完，GPT 59 分钟。抽故事卡和分组不涉及评分标准，没有重做。判完后逐条查了理由：GPT 没有再拿制作成本比高下；Opus 还有 6 场在「上屏」一项里说某一方「一个场景」「两个人、一张桌子」就能撑起爽点，所以更好拍。两位评审排出的名次相关系数 0.87，每对的最终结果 198 个里 135 个一致，不一致的 63 个标「有争议」。这一页的积分、对阵表、评审体检和点评，都按新判决重算。"
evidence = ["page:checks/#agreement", "file:evals/runs/002-topic/duels.jsonl"]
page_label = "评审体检"

