# 参赛名单。entry 是开场用 /entry 调用的入口 skill；不写 entry 的是工具箱型仓库，开场只说「用已安装的 skill」。
# 这一轮比选题：从短剧和小说两个清单里标了「选题」环节、能从零出选题的 skill 里，按星数和精选挑了 11 个。
# 仓库里有专门做选题的 skill，入口就用它；没有就用仓库的主入口。没测的和原因见 run.md。
# runs 是每个参赛者跑几次；固定回复让 agent 在它给出的几个方案里选它最推荐的那个，其他问题也按它自己的推荐。

runs = 3

[prompts]
task = "我要给一个新故事定选题，要求在 premise.md 里。"
toolkit = "我要用已安装的 skill 给一个新故事定选题，要求在 premise.md 里。"
reply = "如果要我在几个题材或故事方案里选，就选你最推荐的那个；其他要我定的，都按你推荐的来，不用再问我。请继续，直到 premise.md 列出的交付都写成文件。"

