body = "匿名稿、配对和两种先后顺序都不变，只换提示词。Opus 5 分钟判完，GPT 21 分钟。抽故事卡和分组不涉及评分标准，没有重做。判完后逐条查了理由，两位评审都没有再拿制作成本比高下。两位评审逐场的判断 89/120 一致，每对的最终结果 39/60 一致，不一致的 21 对标「有争议」。这一页的胜负、评审体检和点评，都按新判决重算。"
