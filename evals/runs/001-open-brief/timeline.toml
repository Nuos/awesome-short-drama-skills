[[event]]
time = "2026-10-23T03:30:00+08:00"
title = "换评分标准，先试判"
body = "两两盲比的提示词换成新的评分标准。原来评审以「有经验的竖屏短剧编辑」的身份评，剧本的「可拍性」看场景和演员数量是否合理。新标准假定稿子要交给 AI 从头拍成竖屏短剧，没有演员和片场，画面、声音、口型都由视频模型生成：特效、异能、奇幻、大场面、群戏、场景多、角色多都不扣分，场面大也不单独加分。「可拍性」改名「上屏」，看每集 1–2 分钟装不装得下（按画面和台词估，不按场景数、演员数），情绪和爽点有没有落在脸上和动作上，能不能直接交给 AI 出片。两轮合起来挑了 10 场原来理由里最常拿场景、演员、特效说事的，两位评审各试判一遍，理由里不再拿制作成本比高下，才开始全部重判。"
evidence = ["file:evals/judge.py"]

[[event]]
time = "2026-10-23T03:35:00+08:00"
