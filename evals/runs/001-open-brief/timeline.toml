# 第一轮的过程记录：试点、自检、正式运行和评审各步的时间，中途改过什么、为什么改。时间是北京时间。
# 网站的「过程记录」页从这里生成。evidence 里 log:<名字> 指 logs/ 下的日志，file:<路径> 指仓库里的文件。

[[event]]
time = "2026-10-18T12:54:00+08:00"
title = "检查运行环境"
body = "清点各参赛 skill 自带的脚本，确认本机的 python3（3.14）和 node（26）能用，没装 matplotlib 之类的第三方库。沙箱里不能联网，装不了包，所以 skill 的脚本只能用标准库跑。正式运行里没有哪次因为缺库报错。"

[[event]]
time = "2026-10-18T12:58:00+08:00"
title = "沙箱自检 1：围栏拦不拦得住"
body = "用便宜的 claude-haiku-5-5，在一个假的工作目录里让 agent 逐条试：读运行者的主目录、读别的参赛者的目录、读上一级目录、联网、在工作目录外写文件，全部被拦；python3、node 能跑，工作目录里能写。用 Read 工具读别的参赛者的文件也被拒。它开的子 agent 试同样的命令，结果一样。"
evidence = ["log:check-1"]

[[event]]
time = "2026-10-18T12:59:00+08:00"
title = "试点 1：固定回复问得太宽，停掉"
body = "对照组和漫剧老李各试跑一次。当时的固定回复是「如果要我选，就选第 1 个……别的要我定的，按你推荐的来」。漫剧老李开场一次问了赛道、素材来源、画风等好几道选择题，这句回复会让它每道题都选第 1 个，而本意只是在故事方案里挑。1 分半钟后停掉两个试点，把回复收窄成「如果要我在几个题材或故事方案里选，就选第 n 个……其他要我定的，都按你推荐的来」。"
evidence = ["log:pilot-1.baseline", "log:pilot-1.lixiaoxiao9888-create__manju-laoli-skill"]

[[event]]
time = "2026-10-18T13:01:00+08:00"
title = "试点 2：cd 之后写不了文件"
body = "用改好的回复重跑这两个。对照组顺利写完。漫剧老李先用 cd 进了 skill 的目录，之后写当前目录的文件被拒：允许写入的规则当时用的是相对路径，会跟着 cd 走。一条 for 循环命令也被拒：在无人值守模式下，沙箱的自动放行不管这类复合命令。它只好把三份稿子贴在回复里，下一轮才写成文件。两个试点的产出都不用，正式运行全部重跑。"
evidence = ["log:pilot-2.baseline", "log:pilot-2.lixiaoxiao9888-create__manju-laoli-skill"]

[[event]]
time = "2026-10-18T13:31:00+08:00"
title = "沙箱自检 2–5：修权限"
body = "自检 2 复现了问题：cd 之后写入被拒，for 循环被拒。自检 3 把写入规则改成绝对路径，cd 之后也能写了。自检 4 确认 for 循环仍被拒，而沙箱照样拦着往 skill 目录里写。自检 5 改成直接放行 Bash、同时关掉「沙箱外运行」（allowUnsandboxedCommands = false）：for 循环能跑了，读主目录、联网、在工作目录外写文件依然被拦。这一次 agent 拒绝了「关掉沙箱再跑」和「读别的参赛者目录」两步，没去试。"
evidence = ["log:check-2", "log:check-3", "log:check-4", "log:check-5", "file:evals/run.py"]

